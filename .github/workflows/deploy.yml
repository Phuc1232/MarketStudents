name: Deploy UniMarket to AWS EC2 (Docker Registry)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  filter:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'src/**'
              - 'app.py'
              - 'requirements.txt'
              - 'Dockerfile'
              - 'docker-compose.prod.yml'
              - 'alembic/**'
              - 'alembic.ini'

  deploy-frontend:
    name: Build & Deploy Frontend
    needs: filter
    if: ${{ needs.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '103759217585-02flg4jnr9ko84d9ogi5pde3vigvkegf.apps.googleusercontent.com' }}
        run: |
          npm ci
          npm run build

      - name: Transfer Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "~/unimarket-fe-temp"
          strip_components: 2

      - name: Apply to Nginx Directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/unimarket/*
            sudo cp -r ~/unimarket-fe-temp/* /var/www/unimarket/
            sudo chown -R www-data:www-data /var/www/unimarket
            sudo chmod -R 755 /var/www/unimarket
            rm -rf ~/unimarket-fe-temp
            echo "Frontend deployed successfully!"

  build-and-deploy-backend:
    name: Build Image on GitHub & Deploy to EC2
    needs: filter
    if: ${{ needs.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/unimarket-api" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via Docker Pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/UniMarket_Project
            # Pull repository changes (alembic, compose, etc.)
            git pull origin master || git pull origin main || true
            
            # Log in to GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull pre-built image from GHCR
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            # Tag image for docker compose usage
            docker tag ${{ env.IMAGE_NAME }}:latest unimarket-api:prod
            
            # Recreate API container without building
            docker compose -f docker-compose.prod.yml up -d --no-build api
            
            # Run database migrations
            docker exec unimarket_api_prod alembic upgrade head
            
            # Clean up old images to keep EC2 disk clean
            docker image prune -f
            
            echo "Backend deployed from GHCR successfully!"
