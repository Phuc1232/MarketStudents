version: '3.8'

services:
  db:
    image: postgres:16-alpine3.22  # Bản nhẹ nhất, ổn định
    container_name: unimarket_db_container
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123  # Mật khẩu DB (nhớ đổi nếu muốn)
      - POSTGRES_DB=unimarket_db       # Tên Database của dự án
    ports:
      - "5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: